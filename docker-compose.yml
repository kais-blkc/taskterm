services:
  db:
    image: postgres:17-alpine
    container_name: taskterm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskterm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: taskterm
    volumes:
      - taskterm-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskterm -d taskterm']
      interval: 5s
      timeout: 3s
      retries: 10
    # наружу порт не публикуем: БД доступна только приложению внутри сети compose

  app:
    build: .
    image: taskterm
    container_name: taskterm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # APP_BIND=127.0.0.1, если наружу приложение смотрит только через Caddy (профиль https)
      - '${APP_BIND:-0.0.0.0}:${APP_PORT:-3100}:3100'
    environment:
      JWT_SECRET: ${JWT_SECRET:?задай JWT_SECRET в .env (openssl rand -base64 48)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DATABASE_URL: postgres://taskterm:${POSTGRES_PASSWORD}@db:5432/taskterm
      # true — только если перед приложением стоит HTTPS (иначе cookie входа не сохранится)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

  # HTTPS: docker compose --profile https up -d  (нужны DOMAIN, COOKIE_SECURE=true, TRUST_PROXY=true)
  caddy:
    image: caddy:2-alpine
    container_name: taskterm-caddy
    profiles: ['https']
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  taskterm-pg:
  caddy-data:
  caddy-config:
